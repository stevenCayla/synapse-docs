name: CI

on:
  pull_request:
  push:
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      sync:
        description: Refresh the content from SYNAPSE-MEDICAL before building (develop only)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  target:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.target.outputs.branch }}
      sync: ${{ steps.target.outputs.sync }}
      deploy: ${{ steps.target.outputs.deploy }}
    steps:
      # develop (push or manual run) → dev-docs. main → docs, but ONLY through
      # a manual run: the plan has no "required reviewers" environment rule, so
      # running the workflow by hand on main is the approval gate. A push to
      # main, other branches and pull requests are only built.
      # The content sync is started by the application repository with
      # `gh workflow run ci.yaml --ref develop -f sync=true`, so it always runs
      # on develop (a repository_dispatch would run on the default branch).
      - name: Determine target branch
        id: target
        env:
          SYNC_INPUT: ${{ inputs.sync }}
        run: |
          sync=false
          [ "$SYNC_INPUT" = true ] && sync=true
          case "$GITHUB_EVENT_NAME" in
            pull_request) branch="$GITHUB_HEAD_REF" ;;
            *)            branch="$GITHUB_REF_NAME" ;;
          esac
          if [ "$sync" = true ] && [ "$branch" != develop ]; then
            echo "The content sync is only allowed on develop (ran on $branch)." >&2
            exit 1
          fi
          deploy=false
          case "$GITHUB_EVENT_NAME:$branch" in
            push:develop|workflow_dispatch:develop|workflow_dispatch:main) deploy=true ;;
          esac
          {
            echo "branch=$branch"
            echo "sync=$sync"
            echo "deploy=$deploy"
          } >> "$GITHUB_OUTPUT"
          echo "Branch: $branch — sync: $sync — deploy: $deploy"

  # Refreshes src/content/docs from the docs/ folder of SYNAPSE-MEDICAL
  # (develop), checks that the site still builds, then commits the snapshot.
  sync:
    needs: target
    if: needs.target.outputs.sync == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: sync-${{ needs.target.outputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.target.outputs.branch }}

      - name: Checkout content (SYNAPSE-MEDICAL docs/)
        uses: actions/checkout@v7
        with:
          repository: stevenCayla/SYNAPSE-MEDICAL
          ref: ${{ needs.target.outputs.branch }}
          # Read-only deploy key of SYNAPSE-MEDICAL
          ssh-key: ${{ secrets.SYNAPSE_REPO_SSH_KEY }}
          path: .synapse
          sparse-checkout: docs
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Sync content
        run: SYNAPSE_DIR=.synapse sh scripts/sync-content.sh

      - name: Check the site still builds
        run: npm run build

      - name: Commit the snapshot
        env:
          BRANCH: ${{ needs.target.outputs.branch }}
        run: |
          git add src/content/docs APP_VERSION
          if git diff --cached --quiet; then
            echo "Content already up to date."
            exit 0
          fi
          source_sha="$(git -C .synapse rev-parse --short HEAD)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: sync content from SYNAPSE-MEDICAL@$source_sha"
          git push origin "HEAD:$BRANCH"

  build:
    needs: [target, sync]
    if: ${{ !cancelled() && needs.target.result == 'success' && needs.sync.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          # After a sync, build the branch tip that contains the new snapshot.
          ref: ${{ needs.target.outputs.sync == 'true' && needs.target.outputs.branch || '' }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Upload build
        if: needs.target.outputs.deploy == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  deploy:
    needs: [target, build]
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.target.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    # production is reached only by a manual run on main (see the target job).
    environment:
      name: ${{ needs.target.outputs.branch == 'main' && 'production' || 'development' }}
      url: ${{ needs.target.outputs.branch == 'main' && 'https://docs.synapse-medical.fr' || 'https://dev-docs.synapse-medical.fr' }}
    concurrency:
      group: deploy-${{ needs.target.outputs.branch }}
      cancel-in-progress: false
    steps:
      - name: Checkout site
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: sh scripts/deploy.sh ${{ needs.target.outputs.branch == 'main' && 'prod' || 'dev' }}
