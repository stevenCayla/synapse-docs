version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    groups:
      # Astro, Starlight and their integrations move together.
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
          - "astro-*"
      tooling:
        patterns:
          - "wrangler"
          - "sharp"
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
